# Veille hebdomadaire : chaque lundi à 8 h (heure de Paris), Claude Code cherche les
# nouvelles offres selon consigne.md et écrit veille/AAAA-MM-JJ.md, puis le workflow
# l'enregistre dans le dépôt.

name: Veille hebdomadaire

on:
  schedule:
    # GitHub ne connaît que l'heure UTC. 8 h à Paris = 6 h UTC en été, 7 h UTC en hiver.
    # On programme les deux, et l'étape "Heure de Paris" ne garde que la bonne.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Heure de Paris
        id: heure
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Paris date +%z)
          RUN=true
          if [ "$SCHEDULE" = "0 6 * * 1" ] && [ "$OFFSET" != "+0200" ]; then RUN=false; fi
          if [ "$SCHEDULE" = "0 7 * * 1" ] && [ "$OFFSET" != "+0100" ]; then RUN=false; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
          echo "Décalage Paris : $OFFSET, déclencheur : ${SCHEDULE:-manuel}, on lance : $RUN"

      - uses: actions/checkout@v7
        if: steps.heure.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.heure.outputs.run == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        if: steps.heure.outputs.run == 'true'
        with:
          python-version: "3.12"

      # Interroge directement les sites carrières listés dans sources.json (Workday,
      # SmartRecruiters, GlobalSportsJobs...) et garde les offres qui ne sont ni sur le
      # site de la veille ni déjà livrées. Claude relit ensuite cette liste.
      - name: Moissonner les sites carrières
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          S=skills/veille-ssb
          mkdir -p out
          python3 "$S/scripts/harvest.py" --sources "$S/references/sources.json" \
            --board data/offres.json --history "$S/references/historique.md" \
            --date "$DATE" --out out/candidats.json

      - name: Installer Claude Code
        if: steps.heure.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Une recherche par ligne de la section "Sources à couvrir" de consigne.md :
      # un seul appel s'arrêtait après deux ou trois sources.
      - name: Chercher source par source
        if: steps.heure.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          # Relancée le même jour, la veille repart de zéro au lieu de se croire déjà faite.
          rm -f "veille/$DATE.md"
          touch out/trouvailles.md
          awk '/^## /{on=($0 ~ /^## Sources à couvrir/)} on && /^- /{sub(/^- /,""); print}' consigne.md > out/sources.txt
          echo "Sources : $(wc -l < out/sources.txt)"
          while IFS= read -r SOURCE; do
            echo "::group::$SOURCE"
            claude -p "$(cat consigne.md)

          ---
          Date du jour : $DATE.
          TA TÂCHE : cherche les offres correspondant aux critères sur cette source uniquement : $SOURCE.
          Ouvre chaque annonce pour vérifier qu'elle est en ligne et récente.
          Écarte les offres déjà connues, et celles déjà dans out/trouvailles.md.
          Ajoute chaque offre retenue à la fin de out/trouvailles.md, au format d'une offre (sans numéro).
          Termine en ajoutant une ligne « Source : $SOURCE, N offres retenues » et une phrase sur ce que tu as pu consulter ou non.
          N'écris aucun autre fichier." \
              --allowedTools "WebSearch WebFetch Read Write Edit Glob Grep" \
              --permission-mode dontAsk < /dev/null || echo "::warning::Recherche échouée : $SOURCE"
            echo "::endgroup::"
          done < out/sources.txt

      - name: Écrire le récapitulatif
        if: steps.heure.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          claude -p "$(cat consigne.md)

          ---
          Date du jour : $DATE.
          TA TÂCHE : écrire le récapitulatif de la semaine dans veille/$DATE.md, puis les mêmes offres pour le site dans out/nouvelles.json (et aucun autre fichier).
          Tu as deux listes de départ :
          1. out/trouvailles.md : les offres trouvées source par source, déjà vérifiées, avec une ligne de bilan par source.
          2. out/candidats.json : des offres récentes relevées directement sur les sites carrières de 80 employeurs du sport.
             Relis chacune (champ _extrait, ouvre le lien en cas de doute) et garde celles qui correspondent aux critères.
          Écarte les offres déjà connues et les doublons entre les deux listes.
          Garde les 15 plus pertinentes au maximum, classées, au format du fichier de la semaine.
          Dans « Sources consultées », reprends les bilans de out/trouvailles.md et ajoute le moissonnage des sites carrières.

          Ensuite, écris out/nouvelles.json : toutes les offres retenues cette semaine (même au-delà des 15 du récapitulatif),
          au format décrit dans skills/veille-ssb/SKILL.md (cherche « où offres.json est un fichier que tu écris toi-même ») :
          {\"offres\": [{\"titre\", \"entreprise\", \"categorie\", \"secteur\", \"localisation\", \"pays\", \"contrat\", \"date_iso\", \"date_pub\", \"lien\", \"source\", \"infos\"}], \"bilan\": {\"total_testees_ecartees\": 0, \"detail_ecartees\": [], \"portails_steriles\": [], \"nouveaux_portails\": []}}.
          contrat vaut Stage, Alternance, CDI, CDD ou Freelance (un VIE = CDD). categorie prend une des valeurs listées dans SKILL.md.
          date_iso est la date de publication AAAA-MM-JJ, ou null si elle est inconnue. Le JSON doit être valide." \
            --allowedTools "WebSearch WebFetch Read Write Edit Glob Grep" \
            --permission-mode dontAsk

      - name: Vérifier que le fichier existe
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          test -s "veille/$DATE.md" || { echo "Claude n'a pas écrit veille/$DATE.md"; exit 1; }
          cat "veille/$DATE.md"

      - name: Enregistrer le récapitulatif
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add veille/
          git commit -m "Veille hebdo du $DATE" || echo "Rien de nouveau"

      # Ajoute les offres au tableau du site, retire les offres closes, régénère la page,
      # l'Excel et le CSV, et met en ligne veille.sorbonnesportbusiness.com (site/publish.sh).
      - name: Mettre le site à jour
        if: steps.heure.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : site non mis à jour."
            exit 0
          fi
          python3 -c "import json; json.load(open('out/nouvelles.json'))" \
            || { echo "::error::out/nouvelles.json absent ou invalide"; exit 1; }
          bash site/publish.sh out/nouvelles.json "$DATE"

      - name: Pousser sur GitHub
        if: steps.heure.outputs.run == 'true'
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
