# Veille : chaque lundi et chaque jeudi à 3 h (heure de Paris).
# Même méthode que la tâche planifiée du Mac : moissonneur d'API, puis une recherche
# Claude par famille de consigne.md (en parallèle), fusion, mise à jour des références,
# récapitulatif dans veille/AAAA-MM-JJ.md, puis mise en ligne du site (site/publish.sh).

name: Veille hebdomadaire

on:
  schedule:
    # GitHub ne connaît que l'heure UTC. 3 h à Paris = 1 h UTC en été, 2 h UTC en hiver.
    # On programme les deux, et l'étape "Heure de Paris" ne garde que la bonne.
    - cron: "0 1 * * 1,4"
    - cron: "0 2 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    # Version de Linux fixée : celle des tests du 17/10 (ubuntu-latest passe à Ubuntu 26 le 19/10).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      run: ${{ steps.heure.outputs.run }}
    steps:
      - name: Heure de Paris
        id: heure
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Paris date +%z)
          RUN=true
          if [ "$SCHEDULE" = "0 1 * * 1,4" ] && [ "$OFFSET" != "+0200" ]; then RUN=false; fi
          if [ "$SCHEDULE" = "0 2 * * 1,4" ] && [ "$OFFSET" != "+0100" ]; then RUN=false; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
          echo "Décalage Paris : $OFFSET, déclencheur : ${SCHEDULE:-manuel}, on lance : $RUN"

      # Pas de jeton GitHub laissé dans le clone pendant que Claude lit des pages web :
      # il n'est fourni qu'à l'étape "Pousser sur GitHub".
      - uses: actions/checkout@v7
        if: steps.heure.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.heure.outputs.run == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        if: steps.heure.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Moissonner les sites carrières
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          S=skills/veille-ssb
          mkdir -p out/candidats "out/lots/$DATE" out/sources-proposees out/logs
          python3 "$S/scripts/harvest.py" --sources "$S/references/sources.json" \
            --board data/offres.json --history "$S/references/historique.md" \
            --date "$DATE" --out "out/candidats/$DATE-api.json"

      - name: Installer Claude Code
        if: steps.heure.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Une session Claude par ligne de la section "Familles de recherche" de consigne.md,
      # toutes en même temps, comme les sous-agents de la tâche du Mac.
      - name: Chercher (familles en parallèle)
        if: steps.heure.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          CONSIGNE="$(sed "s/AAAA-MM-JJ/$DATE/g" consigne.md)"
          awk '/^## /{on=($0 ~ /^## Familles de recherche/)} on && /^- [a-z-]+ : /{sub(/^- /,""); print}' consigne.md > out/familles.txt
          echo "Familles : $(cut -d' ' -f1 out/familles.txt | tr '\n' ' ')"
          while IFS= read -r LIGNE; do
            FAMILLE="${LIGNE%% : *}"
            timeout 100m claude -p "$CONSIGNE

          ---
          Date du jour : $DATE.
          TA FAMILLE : $LIGNE
          Fais uniquement cette famille, en suivant les règles communes, puis écris out/lots/$DATE/$FAMILLE.json.
          Termine par un bilan en deux lignes : nombre d'offres retenues, sources consultées ou bloquées." \
              --allowedTools "WebSearch WebFetch Read Write Edit Glob Grep Bash" \
              --permission-mode dontAsk < /dev/null > "out/logs/$FAMILLE.log" 2>&1 &
            sleep 5
          done < out/familles.txt
          wait
          while IFS= read -r LIGNE; do
            FAMILLE="${LIGNE%% : *}"
            echo "::group::$FAMILLE"
            cat "out/logs/$FAMILLE.log"
            echo "::endgroup::"
            python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['offres']), 'offres')" "out/lots/$DATE/$FAMILLE.json" \
              || echo "::warning::Famille $FAMILLE : pas de fichier d'offres valide"
          done < out/familles.txt

      - name: Fusionner
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          S=skills/veille-ssb
          VALIDES=()
          for F in out/lots/"$DATE"/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$F" 2>/dev/null && VALIDES+=("$F")
          done
          if [ ${#VALIDES[@]} -eq 0 ]; then
            echo '{"offres": [], "bilan": {}}' > out/nouvelles.json
          else
            python3 "$S/scripts/merge_lots.py" "${VALIDES[@]}" --board data/offres.json \
              --history "$S/references/historique.md" --out out/nouvelles.json
          fi

      - name: Références et récapitulatif
        if: steps.heure.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          # Relancée le même jour, la veille réécrit son récapitulatif.
          rm -f "veille/$DATE.md"
          timeout 40m claude -p "$(sed "s/AAAA-MM-JJ/$DATE/g" consigne.md)

          ---
          Date du jour : $DATE.
          TA TÂCHE : les recherches sont faites et fusionnées dans out/nouvelles.json.
          Fais les trois points de la section « Après les recherches », puis termine par un résumé court." \
            --allowedTools "WebSearch WebFetch Read Write Edit Glob Grep Bash" \
            --permission-mode dontAsk < /dev/null

      - name: Vérifier le récapitulatif
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          test -s "veille/$DATE.md" || { echo "::error::Claude n'a pas écrit veille/$DATE.md"; exit 1; }
          cat "veille/$DATE.md"

      - name: Enregistrer le récapitulatif
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add veille/
          git commit -m "Veille du $DATE (récapitulatif)" || echo "Rien de nouveau"

      # Ajoute les offres au tableau du site, retire les offres closes, régénère la page,
      # l'Excel et le CSV, met en ligne veille.sorbonnesportbusiness.com, et committe
      # data/ et les références (site/publish.sh).
      - name: Mettre le site à jour
        if: steps.heure.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : site non mis à jour."
            exit 0
          fi
          bash site/publish.sh out/nouvelles.json "$DATE"

      - name: Pousser sur GitHub
        if: steps.heure.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Vérifier le site
        if: steps.heure.outputs.run == 'true'
        env:
          DATE: ${{ steps.heure.outputs.date }}
        run: |
          curl -fsS https://veille.sorbonnesportbusiness.com/offres.json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['date_maj'], len(d['offres']), 'offres'); sys.exit(d['date_maj'] != sys.argv[1])" "$DATE"

  # Passe LinkedIn connectée : sur le Mac de Tom (runner auto-hébergé, étiquette « ego »),
  # dans le navigateur Ego Lite où son compte LinkedIn est ouvert. Elle démarre après la
  # veille ; si le Mac est éteint ou en veille, GitHub la garde en attente (24 h au plus) et
  # elle part dès qu'il se rallume. Détails : section « Passe LinkedIn connectée » de consigne.md.
  linkedin:
    needs: veille
    if: ${{ !cancelled() && needs.veille.outputs.run == 'true' }}
    runs-on: [self-hosted, macOS, ego]
    timeout-minutes: 120
    env:
      PATH: /Users/tom/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Date
        id: d
        run: echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      # Lecture seule, 25 recherches d'offres + 15 de posts au plus, arrêt sur vérification.
      - name: Chercher sur LinkedIn (Ego Lite)
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          S=skills/veille-ssb
          mkdir -p out/candidats "out/lots/$DATE"
          python3 "$S/scripts/ego_linkedin.py" --requetes "$S/references/ego-requetes.json" \
            --board data/offres.json --history "$S/references/historique.md" \
            --date "$DATE" --out "out/candidats/$DATE-ego.json"

      - name: Relire les candidates
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.d.outputs.date }}
        run: |
          claude -p "$(sed "s/AAAA-MM-JJ/$DATE/g" consigne.md)

          ---
          Date du jour : $DATE.
          TA TÂCHE : la relecture de la section « Passe LinkedIn connectée », sur out/candidats/$DATE-ego.json.
          Termine par un bilan en deux lignes." \
            --allowedTools "WebSearch WebFetch Read Write Edit Glob Grep Bash" \
            --disallowedTools "Bash(ego-browser:*)" "Bash(/Users/tom/.local/bin/ego-browser:*)" \
            --permission-mode dontAsk < /dev/null

      - name: Fusionner
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          S=skills/veille-ssb
          VALIDES=()
          for F in out/lots/"$DATE"/ego-*.json; do
            [ -f "$F" ] && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$F" 2>/dev/null && VALIDES+=("$F")
          done
          if [ ${#VALIDES[@]} -eq 0 ]; then
            echo '{"offres": [], "bilan": {}}' > out/nouvelles-ego.json
          else
            python3 "$S/scripts/merge_lots.py" "${VALIDES[@]}" --board data/offres.json \
              --history "$S/references/historique.md" --out out/nouvelles-ego.json
          fi

      - name: Mettre le site à jour
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATE: ${{ steps.d.outputs.date }}
        run: bash site/publish.sh out/nouvelles-ego.json "$DATE"

      - name: Compléter le récapitulatif
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          python3 - "$DATE" <<'PY'
          import json, sys
          from pathlib import Path
          date = sys.argv[1]
          c = json.load(open(f"out/candidats/{date}-ego.json"))
          n = json.load(open("out/nouvelles-ego.json"))["offres"]
          lines = ["", "## Passe LinkedIn connectée (Mac, Ego Lite)", "",
                   f"- {len(c['recherches'])} recherches, {len(c['offres'])} candidates, {len(n)} nouvelles offres au tableau."]
          if c.get("bloque"):
              lines.append(f"- Passe arrêtée : {c['bloque']}.")
          lines += [f"- {o['titre']}, {o['entreprise']} : {o['lien']}" for o in n]
          recap = Path(f"veille/{date}.md")
          recap.parent.mkdir(exist_ok=True)
          text = recap.read_text(encoding="utf-8") if recap.exists() else f"# Veille sport business du {date}\n"
          recap.write_text(text.rstrip("\n") + "\n" + "\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add veille/
          git commit -m "Veille du $DATE (passe LinkedIn connectée)" || echo "Rien de nouveau"

      - name: Pousser sur GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          git push origin HEAD:main
