# Page en ligne de la veille : https://veille.sorbonnesportbusiness.com
# Compte Cloudflare de SSB (celui de la zone sorbonnesportbusiness.com) : CLOUDFLARE_ACCOUNT_ID et
# CLOUDFLARE_API_TOKEN sont lus dans site/.env (jamais commité) par site/publish.sh.
name = "veille-ssb"
compatibility_date = "2026-09-01"
routes = [{ pattern = "veille.sorbonnesportbusiness.com", custom_domain = true }]
workers_dev = false

[assets]
directory = "./public"
